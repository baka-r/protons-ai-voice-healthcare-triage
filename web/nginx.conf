worker_processes auto;
pid /tmp/nginx.pid;
events { worker_connections 1024; }

http {
  include /etc/nginx/mime.types;
  types {
    text/javascript mjs;
    application/wasm wasm;
  }
  default_type application/octet-stream;
  server_tokens off;
  sendfile on;
  gzip on;
  gzip_types text/css application/javascript text/javascript application/json image/svg+xml application/wasm;

  client_body_temp_path /tmp/client_temp;
  proxy_temp_path /tmp/proxy_temp;
  fastcgi_temp_path /tmp/fastcgi_temp;
  uwsgi_temp_path /tmp/uwsgi_temp;
  scgi_temp_path /tmp/scgi_temp;

  map $http_upgrade $connection_upgrade { default upgrade; '' close; }

  # Behind the TLS proxy (Caddy) the real client address arrives in X-Forwarded-For. Only trust it from private networks
  # (the proxy). Never publish this container directly to the internet - always go through the proxy.
  set_real_ip_from 10.0.0.0/8;
  set_real_ip_from 172.16.0.0/12;
  set_real_ip_from 192.168.0.0/16;
  real_ip_header X-Forwarded-For;
  real_ip_recursive on;

  # abuse protection (per client IP)
  limit_req_zone $binary_remote_addr zone=api:10m rate=20r/s;
  limit_req_zone $binary_remote_addr zone=login:10m rate=6r/m;
  limit_conn_zone $binary_remote_addr zone=wsconn:10m;
  limit_req_status 429;
  limit_conn_status 429;

  server {
    listen 8080;
    root /usr/share/nginx/html;
    index index.html;
    client_max_body_size 64k;

    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy no-referrer always;
    add_header Permissions-Policy "microphone=(self), camera=(), geolocation=()" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'wasm-unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self' ws: wss:; worker-src 'self' blob:; media-src 'self' blob:; object-src 'none'; base-uri 'self'; frame-ancestors 'none'" always;

    # Re-resolve the agent's address (Docker DNS) so restarts of the agent don't break the proxy.
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $agent http://agent:8000;

    location = /api/staff/login {
      limit_req zone=login burst=4 nodelay;
      proxy_pass $agent;
      proxy_set_header Host $http_host;
      proxy_set_header X-Real-IP $remote_addr;
    }

    location /api/ {
      limit_req zone=api burst=40 nodelay;
      proxy_pass $agent;
      proxy_set_header Host $http_host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_read_timeout 60s;
    }

    location /ws/ {
      limit_conn wsconn 8;
      proxy_pass $agent;
      proxy_http_version 1.1;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection $connection_upgrade;
      proxy_set_header Host $http_host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_read_timeout 3600s;
      proxy_buffering off;
    }

    location /vad/ {
      add_header Cache-Control "public, max-age=86400";
      add_header X-Content-Type-Options nosniff always;
      try_files $uri =404;
    }

    location /assets/ {
      add_header Cache-Control "public, max-age=31536000, immutable";
      add_header X-Content-Type-Options nosniff always;
      try_files $uri =404;
    }

    location / {
      add_header Cache-Control "no-cache";
      add_header X-Content-Type-Options nosniff always;
      add_header X-Frame-Options DENY always;
      add_header Referrer-Policy no-referrer always;
      add_header Permissions-Policy "microphone=(self), camera=(), geolocation=()" always;
      add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'wasm-unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self' ws: wss:; worker-src 'self' blob:; media-src 'self' blob:; object-src 'none'; base-uri 'self'; frame-ancestors 'none'" always;
      try_files $uri /index.html;
    }
  }
}
