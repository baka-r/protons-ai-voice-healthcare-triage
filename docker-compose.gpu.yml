# Optional NVIDIA GPU for Kokoro:  docker compose -f docker-compose.yml -f docker-compose.gpu.yml up -d
services:
  tts:
    image: ghcr.io/remsky/kokoro-fastapi-gpu:latest
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
