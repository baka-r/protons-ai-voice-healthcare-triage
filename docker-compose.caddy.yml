# Standalone HTTPS front door for a host with NO other reverse proxy (binds 80/443).
#   DOMAIN=hania.example.com docker compose -f docker-compose.yml -f docker-compose.prod.yml -f docker-compose.caddy.yml up -d --build
services:
  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    cap_drop: ["ALL"]
    cap_add: ["NET_BIND_SERVICE"]
    security_opt: ["no-new-privileges:true"]
    depends_on: [hania-web]
    environment:
      DOMAIN: ${DOMAIN:?set DOMAIN}
    ports: ["80:80", "443:443"]
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    mem_limit: 128m

volumes:
  caddy-data:
  caddy-config:
