name: ci
on:
  push:
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build agent image
        run: docker build -t triage-agent ./agent
      - name: Unit tests + 1,200-case safety regression gate (no network, LLM offline)
        run: docker run --rm -e TZ=Asia/Karachi triage-agent python -m pytest -q
      - name: Approved-document retrieval accuracy
        run: docker run --rm -e TZ=Asia/Karachi triage-agent python -m app.evalrun --retrieval

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Type-check and build the web app
        run: docker build -t triage-web ./web

  secrets-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - name: Block committed secrets
        run: |
          if git ls-files | grep -E '(^|/)\.env$'; then echo ".env must not be committed"; exit 1; fi
          if git grep -nE '(sk-proj-[A-Za-z0-9_-]{20,}|gsk_[A-Za-z0-9]{30,})' -- . ':!docs' ; then echo "API key found in repo"; exit 1; fi
